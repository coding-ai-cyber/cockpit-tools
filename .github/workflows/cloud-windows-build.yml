name: "Build Windows Patched Exe"

on:
  push:
    branches:
      - "build/windows-exe"
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: "Build Windows x64 Release (with embedded frontend)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Host build cache
        uses: ./.github/actions/host-build-cache
        with:
          target: windows

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Tauri release executable (embeds dist via custom-protocol)
        run: |
          npx tauri build --no-bundle

      - name: Upload patched cockpit-tools.exe
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-tools-windows-exe
          retention-days: 7
          if-no-files-found: error
          path: target/release/cockpit-tools.exe
